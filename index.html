<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <title>NIJI APERIA - Master Admin</title>
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ملف الإعدادات الخاص بك -->
    <script src="config.js" defer></script>
    
    <style>
        :root {
            --bg: #090909;
            --panel: #121212;
            --panel2: #191919;
            --gold: #c0a46c;
            --gold2: #aadbe0;
            --text: #eee9df;
            --muted: #999;
            --line: rgba(190, 164, 92, 22);
            --green: #52b788;
            --red: #b66b4b;
            --blue: #77a9d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; line-height: 1.6; }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        a { color: inherit; text-decoration: none; }
        .hidden { display: none !important; }
        .container { width: min(1200px, 94%); margin: auto; }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .nav {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo { font-family: 'Cormorant Garamond', serif; font-size: 27px; color: var(--gold); letter-spacing: 2px; }
        
        .btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 4px;
            transition: 0.3s;
        }
        .btn:hover, .btn-primary { background: var(--gold); color: #090909; }

        .hero {
            text-align: center;
            padding: 95px 15px;
            background: radial-gradient(ellipse, #252116, #090909 70%);
            border-bottom: 1px solid var(--line);
        }
        .hero h1 { font: 700 clamp(42px, 5vw, 55px) 'Cormorant Garamond'; color: var(--gold); margin-bottom: 15px; }
        .hero p { color: var(--muted); max-width: 450px; margin: 15px auto 25px; }

        /* نافذة تسجيل الدخول المنبثقة (Modal) */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal.open { display: flex; }
        .modal-box {
            background: var(--panel2);
            border: 1px solid var(--gold);
            padding: 25px;
            width: min(400px, 100%);
            border-radius: 8px;
        }
        .modal-box h2 { color: var(--gold); margin-bottom: 15px; font-size: 22px; }
        .field { width: 100%; background: #191919; border: 1px solid #39332a; color: white; padding: 11px; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="container nav">
            <div class="logo">NIJI APERIA</div>
            <!-- تم إضافة المعرف loginBtn هنا لضمان الاستجابة -->
            <button id="loginBtn" class="btn">تسجيل الدخول</button>
        </div>
    </header>

    <main class="hero">
        <div class="container">
            <h1>لوحة التحكم الرئيسية</h1>
            <p>مرحباً بك في نظام الإدارة الخاص بك. اضغط على زر تسجيل الدخول للبدء.</p>
        </div>
    </main>

    <!-- نافذة تسجيل الدخول (Modal) -->
    <div id="loginModal" class="modal">
        <div class="modal-box">
            <h2>تسجيل الدخول</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="البريد الإلكتروني" class="field" required>
                <input type="password" id="password" placeholder="كلمة المرور" class="field" required>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">دخول</button>
                <button type="button" id="closeModal" class="btn" style="width: 100%; margin-top: 8px; border-color: var(--muted); color: var(--muted);">إلغاء</button>
            </form>
        </div>
    </div>

    <script>
        // كود برمجي آمن للتحكم بظهور واختفاء نافذة تسجيل الدخول عند الضغط على الزر
        const loginBtn = document.getElementById('loginBtn');
        const loginModal = document.getElementById('loginModal');
        const closeModal = document.getElementById('closeModal');
        const loginForm = document.getElementById('loginForm');

        // فتح النافذة عند الضغط على زر تسجيل الدخول
        loginBtn.addEventListener('click', () => {
            loginModal.classList.add('open');
        });

        // إغلاق النافذة عند الضغط على زر الإلغاء
        closeModal.addEventListener('click', () => {
            loginModal.classList.remove('open');
        });

        // إغلاق النافذة عند النقر خارج صندوق الدخول
        loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                loginModal.classList.remove('open');
            }
        });

        // معالجة نموذج تسجيل الدخول (يمكنك ربطه بـ Supabase لاحقاً)
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.warn("جاري محاولة تسجيل الدخول بـ:", email);
            alert("تم إرسال بيانات الدخول بنجاح (قم بربطها بـ Supabase هنا)");
            
            // مثال على ربط Supabase (تأكد من تعريف supabase في config.js):
            // 
            // supabase.auth.signInWithPassword({ email, password }).then(({ data, error }) => {
            //     if (error) alert(error.message);
            //     else { alert('تم تسجيل الدخول بنجاح!'); location.reload(); }
            // });
        });
    </script>
</body>
</html>
