
<script>
"use strict";

/* =========================================
   1. SUPABASE CONFIGURATION
========================================= */

const CONFIG = window.NIJI_CONFIG || {};

let db = null;
let currentUser = null;
let currentProfile = null;
let books = [];
let isRegister = false;
let authLoading = false;

if (
  window.supabase &&
  CONFIG.SUPABASE_URL &&
  CONFIG.SUPABASE_ANON_KEY
) {
  db = window.supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_ANON_KEY
  );
}

/* =========================================
   2. GENERAL UTILITIES
========================================= */

const $ = id => document.getElementById(id);

function message(id, text) {
  const element = $(id);
  if (element) element.textContent = text || "";
}

function escapeText(value) {
  return String(value ?? "");
}

function showError(error) {
  console.error("NIJI APORIA:", error);
  return error?.message || "حدث خطأ غير متوقع.";
}

function setButtonLoading(button, loading, text) {
  if (!button) return;
  button.disabled = loading;
  if (loading) {
    button.dataset.oldText = button.textContent;
    button.textContent = text || "يرجى الانتظار...";
  } else {
    button.textContent = button.dataset.oldText || text || "إرسال";
  }
}

/* =========================================
   3. INITIALIZATION
========================================= */

document.addEventListener("DOMContentLoaded", async () => {

  $("year").textContent = new Date().getFullYear();

  if (!db) {
    console.warn("Supabase is not configured.");
    message(
      "authMessage",
      "تحقق من إعدادات Supabase في config.js."
    );
    return;
  }

  const { data: authListener } =
    db.auth.onAuthStateChange((event, session) => {

      currentUser = session?.user || null;

      if (event === "SIGNED_OUT") {
        currentProfile = null;
        updateAccount();
        $("adminSection").classList.add("hidden");
      }

      if (event === "SIGNED_IN" || event === "INITIAL_SESSION") {
        setTimeout(async () => {
          await loadProfile();
          await loadBooks();
        }, 0);
      }
    });

  await loadSession();
  await loadBooks();

  window.addEventListener("beforeunload", () => {
    authListener.subscription.unsubscribe();
  });

});

/* =========================================
   4. AUTH MODAL
========================================= */

function openAuth() {
  $("authModal").classList.add("open");
  $("authEmail").focus();
}

function closeAuth() {
  $("authModal").classList.remove("open");
}

function toggleAuth() {

  isRegister = !isRegister;

  $("authTitle").textContent =
    isRegister ? "إنشاء حساب جديد" : "تسجيل الدخول";

  $("authName").style.display =
    isRegister ? "block" : "none";

  $("authSubmit").textContent =
    isRegister ? "إنشاء الحساب" : "دخول";

  $("authToggle").textContent =
    isRegister
      ? "لديك حساب؟ تسجيل الدخول"
      : "إنشاء حساب جديد";

  message("authMessage", "");
}

/* =========================================
   5. REGISTER AND LOGIN
========================================= */

async function submitAuth() {

  if (!db || authLoading) return;

  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;
  const name = $("authName").value.trim();

  if (!email || !password) {
    message("authMessage", "أدخل البريد الإلكتروني وكلمة المرور.");
    return;
  }

  if (password.length < 6) {
    message("authMessage", "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل.");
    return;
  }

  if (isRegister && !name) {
    message("authMessage", "أدخل اسمك لإنشاء الحساب.");
    return;
  }

  authLoading = true;

  const button = $("authSubmit");
  setButtonLoading(button, true, "يرجى الانتظار...");

  try {

    let result;

    if (isRegister) {

      result = await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: name
          }
        }
      });

      if (result.error) throw result.error;

      if (result.data.session) {
        currentUser = result.data.user;
        await loadProfile();
        closeAuth();
        message("authMessage", "");
      } else {
        message(
          "authMessage",
          "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد التسجيل."
        );
      }

    } else {

      result = await db.auth.signInWithPassword({
        email,
        password
      });

      if (result.error) throw result.error;

      currentUser = result.data.user;

      await loadProfile();
      await loadBooks();

      closeAuth();

      message("authMessage", "");

      $("account").scrollIntoView({
        behavior: "smooth"
      });
    }

  } catch (error) {

    message("authMessage", showError(error));

  } finally {

    authLoading = false;
    setButtonLoading(button, false);

  }
}

/* =========================================
   6. PASSWORD RECOVERY
========================================= */

async function resetPassword() {

  if (!db) {
    message("authMessage", "Supabase غير مربوط.");
    return;
  }

  const email = $("authEmail").value.trim();

  if (!email) {
    message("authMessage", "أدخل بريدك الإلكتروني أولاً.");
    return;
  }

  try {

    const redirectUrl = window.location.origin +
      window.location.pathname;

    const { error } = await db.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: redirectUrl
      }
    );

    if (error) throw error;

    message(
      "authMessage",
      "إذا كان البريد مسجلاً فستصلك رسالة لاستعادة كلمة المرور."
    );

  } catch (error) {

    message("authMessage", showError(error));

  }
}

/* =========================================
   7. SESSION MANAGEMENT
========================================= */

async function loadSession() {

  if (!db) return;

  try {

    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    currentUser = data.session?.user || null;

    updateAccount();

    if (currentUser) {
      await loadProfile();
    }

  } catch (error) {

    console.error("Session error:", error);

  }
}

/* =========================================
   8. USER ACCOUNT DISPLAY
========================================= */

function updateAccount() {

  $("signedOut").classList.toggle(
    "hidden",
    !!currentUser
  );

  $("signedIn").classList.toggle(
    "hidden",
    !currentUser
  );

  if (currentUser) {

    $("profileEmail").textContent =
      currentUser.email || "";

    if (!currentProfile) {
      $("profileName").textContent =
        currentUser.user_metadata?.full_name ||
        "عضو NIJI APORIA";
    }

  }
}

/* =========================================
   9. USER PROFILE
========================================= */

async function loadProfile() {

  if (!db || !currentUser) return;

  try {

    const { data, error } = await db
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

    if (error) throw error;

    currentProfile = data;

    $("profileName").textContent =
      data?.full_name ||
      currentUser.user_metadata?.full_name ||
      "عضو NIJI APORIA";

    const admin = data?.role === "admin";

    $("profileRole").textContent =
      admin
        ? "مدير المنصة — MR NIJI"
        : data?.role === "author"
          ? "مؤلف في NIJI APORIA"
          : "عضو مسجل";

    $("adminSection").classList.toggle(
      "hidden",
      !admin
    );

    updateAccount();

  } catch (error) {

    message(
      "profileRole",
      "تعذر تحميل الملف الشخصي: " + showError(error)
    );

    $("adminSection").classList.add("hidden");

  }

}

/* =========================================
   10. LOGOUT
========================================= */

async function signOut() {

  if (!db) return;

  try {

    const { error } = await db.auth.signOut();

    if (error) throw error;

    currentUser = null;
    currentProfile = null;

    $("adminSection").classList.add("hidden");

    updateAccount();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    alert(showError(error));

  }

}

/* =========================================
   11. LOAD PUBLISHED BOOKS
========================================= */

async function loadBooks() {

  if (!db) return;

  const list = $("bookList");

  list.innerHTML =
    '<p class="notice">جارٍ تحميل المكتبة...</p>';

  try {

    const { data, error } = await db
      .from("books")
      .select("*")
      .eq("status", "published")
      .order("created_at", {
        ascending: false
      });

    if (error) throw error;

    books = data || [];

    filterBooks();

  } catch (error) {

    console.error("Books error:", error);

    list.innerHTML =
      '<p class="notice">تعذر تحميل المكتبة. تحقق من صلاحيات قاعدة البيانات.</p>';

  }

}

/* =========================================
   12. DISPLAY BOOKS
========================================= */

function renderBooks(items) {

  const list = $("bookList");

  list.innerHTML = "";

  $("bookEmpty").classList.toggle(
    "hidden",
    items.length !== 0
  );

  if (!items.length) return;

  items.forEach(book => {

    const div = document.createElement("div");
    div.className = "book";

    const cover = document.createElement("div");
    cover.className = "book-cover";
    cover.textContent = "NIJI APORIA";

    const title = document.createElement("h3");
    title.textContent = book.title || "كتاب بدون عنوان";

    const author = document.createElement("p");
    author.textContent =
      "المؤلف: " + (book.author || "غير محدد");

    const category = document.createElement("p");
    category.textContent =
      "التصنيف: " + (book.category || "عام");

    const price = document.createElement("div");
    price.className = "price";

    price.textContent =
      book.is_free
        ? "مجاني"
        : (book.price != null
            ? Number(book.price).toLocaleString("ar-DZ") + " دج"
            : "مدفوع");

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent =
      book.is_free ? "كتاب مجاني" : "كتاب مدفوع";

    const btn = document.createElement("button");
    btn.className = "btn";
    btn.style.marginTop = "15px";
    btn.style.width = "100%";

    if (book.is_free) {

      btn.textContent = "قراءة / تنزيل";

      btn.addEventListener("click", () => {
        openFreeBook(book);
      });

    } else {

      btn.textContent = "شراء الكتاب";

      btn.addEventListener("click", () => {
        alert(
          "نظام الدفع الإلكتروني لم يتم ربطه بعد. لا توجد عملية شراء فعلية حالياً."
        );
      });

    }

    div.append(
      cover,
      title,
      author,
      category,
      price,
      tag,
      btn
    );

    list.appendChild(div);

  });

}

/* =========================================
   13. OPEN FREE BOOK
========================================= */

async function openFreeBook(book) {

  if (!db) return;

  if (!book.file_path) {
    alert("لم يتم إضافة ملف لهذا الكتاب بعد.");
    return;
  }

  try {

    let url = book.file_path;

    if (!url.startsWith("http://") &&
        !url.startsWith("https://")) {

      const { data, error } = await db.storage
        .from("books")
        .createSignedUrl(url, 300);

      if (error) throw error;

      url = data.signedUrl;

    }

    window.open(url, "_blank", "noopener,noreferrer");

  } catch (error) {

    alert("تعذر فتح الكتاب: " + showError(error));

  }

}

/* =========================================
   14. SEARCH AND FILTER BOOKS
========================================= */

function filterBooks() {

  const query = $("bookSearch")
    .value
    .trim()
    .toLowerCase();

  const type = $("bookFilter").value;

  const filtered = books.filter(book => {

    const text = [
      book.title,
      book.author,
      book.category
    ].join(" ").toLowerCase();

    const matchesSearch = text.includes(query);

    const matchesType =
      !type ||
      (type === "free" && book.is_free) ||
      (type === "paid" && !book.is_free);

    return matchesSearch && matchesType;

  });

  renderBooks(filtered);

}

/* =========================================
   15. ADMIN: ADD NEW BOOK
========================================= */

async function addBook() {

  if (!db || !currentUser) {
    message("adminMessage", "يجب تسجيل الدخول أولاً.");
    return;
  }

  if (currentProfile?.role !== "admin") {
    message("adminMessage", "غير مسموح لك بإضافة الكتب.");
    return;
  }

  const title = $("newBookTitle").value.trim();
  const author = $("newBookAuthor").value.trim();
  const category = $("newBookCategory").value;
  const type = $("newBookType").value;
  const priceValue = $("newBookPrice").value;
  const filePath = $("newBookFile").value.trim();

  if (!title || !author) {
    message("adminMessage", "أدخل عنوان الكتاب واسم المؤلف.");
    return;
  }

  const isFree = type === "free";
  const price = isFree ? 0 : Number(priceValue);

  if (!isFree && (!priceValue || !Number.isFinite(price) || price <= 0)) {
    message("adminMessage", "أدخل سعراً صحيحاً للكتاب المدفوع.");
    return;
  }

  const button = document.querySelector(
    '#adminSection button[onclick="addBook()"]'
  );

  setButtonLoading(button, true, "جارٍ الإضافة...");

  try {

    const { error } = await db
      .from("books")
      .insert({
        title: title,
        author: author,
        category: category,
        is_free: isFree,
        price: price,
        file_path: filePath || null,
        status: "published",
        created_by: currentUser.id
      });

    if (error) throw error;

    message("adminMessage", "تمت إضافة الكتاب بنجاح.");

    $("newBookTitle").value = "";
    $("newBookAuthor").value = "";
    $("newBookPrice").value = "";
    $("newBookFile").value = "";

    await loadBooks();

  } catch (error) {

    message(
      "adminMessage",
      "تعذرت إضافة الكتاب: " + showError(error)
    );

  } finally {

    setButtonLoading(button, false);

  }

}

/* =========================================
   16. ARTICLE SEARCH
========================================= */

function filterArticles() {

  const query = $("searchInput")
    .value
    .trim()
    .toLowerCase();

  const category = $("categoryFilter").value;

  const articles = document.querySelectorAll(
    "#articleList .article"
  );

  let count = 0;

  articles.forEach(article => {

    const text = article.textContent.toLowerCase();

    const articleCategory =
      article.dataset.category || "";

    const matchesSearch = text.includes(query);

    const matchesCategory =
      !category || articleCategory === category;

    const visible =
      matchesSearch && matchesCategory;

    article.style.display =
      visible ? "" : "none";

    if (visible) count++;

  });

  $("articleEmpty").classList.toggle(
    "hidden",
    count !== 0
  );

}

/* =========================================
   17. CATEGORY NAVIGATION
========================================= */

function setCategory(category) {

  const filter = $("categoryFilter");

  const available = Array.from(filter.options)
    .map(option => option.value || option.textContent);

  const aliases = {
    "العلوم": "العلوم",
    "التاريخ": "التاريخ",
    "الأدب": "الأدب"
  };

  const selected = aliases[category] || category;

  if (available.includes(selected)) {
    filter.value = selected;
  } else {
    filter.value = "";
  }

  filterArticles();

}

/* =========================================
   18. MOBILE MENU
========================================= */

document.querySelectorAll("nav a").forEach(link => {

  link.addEventListener("click", () => {

    document.querySelector("nav").classList.remove("show");

  });

});

/* =========================================
   19. MODAL INTERACTION
========================================= */

$("authModal").addEventListener("click", event => {

  if (event.target === $("authModal")) {
    closeAuth();
  }

});

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeAuth();
  }

});

</script>

</body>
</html>
